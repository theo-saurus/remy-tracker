<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remy Live Tracker (Edge)</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; overflow: hidden; }
        
        #container { position: relative; width: 100vw; height: 100vh; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        #ui { position: absolute; bottom: 30px; left: 20px; z-index: 10; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px; }
        
        /* Style for the new button */
        button {
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #00FF00;
            color: black;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:active { background-color: #00cc00; }
    </style>
</head>
<body>
    <div id="container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="overlay"></canvas>
    </div>
    
    <div id="ui">
        <h3 style="margin: 0 0 5px 0;">Remy Tracker (Edge)</h3>
        <div id="status">Status: Loading AI Engine...</div>
        <button id="switchBtn">Switch Camera</button>
    </div>

    <script type="module">
        import { InferenceEngine, CVImage } from "https://esm.sh/inferencejs";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('overlay');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const switchBtn = document.getElementById('switchBtn');

        // NEW: Variables to track the camera state
        let currentStream = null;
        let useFrontCamera = false; // Default to back camera

        // IMPORTANT: Replace with your actual Roboflow Publishable Key
        const PUBLISHABLE_KEY = "YOUR_PUBLISHABLE_KEY"; 

        async function startCamera() {
            try {
                // Stop the existing stream if there is one
                if (currentStream) {
                    currentStream.getTracks().forEach(track => track.stop());
                }

                const mode = useFrontCamera ? "user" : "environment";
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: mode } 
                });
                video.srcObject = currentStream;

                return new Promise((resolve) => {
                    video.onloadeddata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });
            } catch (err) {
                statusText.innerText = "Camera Error: " + err.message;
            }
        }

        async function startApp() {
            try {
                const inferEngine = new InferenceEngine();
                
                statusText.innerText = "Status: Downloading Model to Phone...";
                const workerId = await inferEngine.startWorker("dog-poses-q81vj", 2, PUBLISHABLE_KEY);
                
                statusText.innerText = "Status: Starting Camera...";
                await startCamera();
                
                statusText.innerText = "Status: Tracking Live!";
                detectFrame(inferEngine, workerId);

                // Add the click listener to the new button
                switchBtn.addEventListener('click', async () => {
                    switchBtn.disabled = true;
                    useFrontCamera = !useFrontCamera; // Toggle the state
                    await startCamera();
                    switchBtn.disabled = false;
                });

            } catch (err) {
                statusText.innerText = "Error: " + err.message;
            }
        }

        async function detectFrame(inferEngine, workerId) {
            const img = new CVImage(video);
            const predictions = await inferEngine.infer(workerId, img);
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            predictions.forEach(p => {
                if (p.confidence < 0.40) return;

                const x = p.bbox.x - p.bbox.width / 2;
                const y = p.bbox.y - p.bbox.height / 2;
                
                ctx.strokeStyle = "#00FF00";
                ctx.lineWidth = 6;
                ctx.strokeRect(x, y, p.bbox.width, p.bbox.height);
                
                ctx.fillStyle = "#00FF00";
                ctx.font = "bold 30px Arial";
                ctx.fillText(`Remy: ${p.class.toUpperCase()}`, x, y - 10);
            });

            requestAnimationFrame(() => detectFrame(inferEngine, workerId));
        }

        startApp();
    </script>
</body>
</html>
